name: CI Pipeline

on:
  push:
    branches:
      - feature/undo-redo
  pull_request:
    branches:
      - main
      - feature/undo-redo

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up JDK 11
        uses: actions/setup-java@v2
        with:
          java-version: '11'

      - name: Build with Maven
        run: mvn clean install -DskipTests